
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  <title>Edonata</title>

  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background-color: #ffffff;
    }

    main {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    picture {
      display: block;
      width: 100%;
      max-width: 900px;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 80vh;
      max-height: 80svh;
      object-fit: contain;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #000000;
      }
    }
  </style>

  <!-- Favicons -->
  <link rel="icon" type="image/png"
        href="./favicon-96x96.png" sizes="96x96">

  <link rel="icon" type="image/svg+xml"
        href="./favicon.svg?v=2">

  <link rel="shortcut icon"
        href="./favicon.ico">

  <link rel="apple-touch-icon" sizes="180x180"
        href="./apple-touch-icon.png">

  <link rel="manifest"
        href="./site.webmanifest">
</head>

<body>
  <main>
    <picture>
      <source
        media="(prefers-color-scheme: dark)"
        srcset="./dragonfly.dark.svg"
        type="image/svg+xml"
      >
      <img
        src="./dragonfly.svg"
        alt="Animated ASCII dragonfly"
        width="800"
        height="250"
      >
    </picture>
  </main>
</body>
</html>
