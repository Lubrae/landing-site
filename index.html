<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  <title>Edonata</title>

  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background-color: #ffffff;
    }

    main {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    picture {
      display: block;
      width: 100%;
      max-width: 900px;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 80vh;
      max-height: 80svh;
      object-fit: contain;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #000000;
      }
    }

  @font-face {
    font-family: "KH Interference";
    src: url("./fonts/KHInterference-Regular.woff2")
        format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  .logo-container {
    position: relative;
    width: 100%;
    max-width: 900px;
  }

  .logo-container h1 {
    position: absolute;
    bottom: calc(100% + 36px);
    left: 0;
    right: 0;

    margin: 0;
    text-align: center;

    font-family: "KH Interference", monospace;
    font-size: min(48px, calc((100vw - 40px) / 13.5));
    font-weight: 400;
    letter-spacing: 0.03em;
    line-height: 1.2;
    white-space: nowrap;

    color: #000000;
  }


  .type-track {
    position: relative;
    display: inline-block;
    white-space: nowrap;
  }

  .type-measure {
    visibility: hidden;
  }

  .type-live {
    position: absolute;
    top: 0;
    left: 0;
    white-space: nowrap;
  }

  .cursor-space,
  .typing-cursor {
    display: inline-block;
    width: 0.65em;
    height: 0.9em;
    vertical-align: -0.08em;
  }

  .typing-cursor {
    background: #5300FF;
  }

/* Blink only after typing finishes */
.type-live.finished .typing-cursor {
  animation: cursor-blink 0.8s steps(1, end) infinite;
}

@keyframes cursor-blink {
  50% {
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .typing-cursor {
    animation: none !important;
  }
}


  @media (prefers-color-scheme: dark) {
    .logo-container h1 {
      color: #FFFFFF;
    }
  }
  </style>

  <!-- Favicons -->
  <link rel="icon" type="image/png"
        href="./favicon-96x96.png" sizes="96x96">

  <link rel="icon" type="image/svg+xml"
        href="./favicon.svg?v=2">

  <link rel="shortcut icon"
        href="./favicon.ico">

  <link rel="apple-touch-icon" sizes="180x180"
        href="./apple-touch-icon.png">

  <link rel="manifest"
        href="./site.webmanifest">
</head>

<body>
  <main>
    <div class="logo-container">
      <h1 aria-label="Electronic Odonata">
        <span class="type-track" aria-hidden="true">
          <span class="type-measure">[ELECTRONIC]ODONATA<span class="cursor-space"></span></span>
          <span class="type-live"><span id="typed-text"></span><span class="typing-cursor"></span></span>
        </span>
      </h1>


      <picture>
        <source
          media="(prefers-color-scheme: dark)"
          srcset="./dragonfly.dark.svg"
          type="image/svg+xml"
        >
        <img
          src="./dragonfly.svg"
          alt="ASCII dragonfly"
          width="800"
          height="250"
        >
      </picture>
    </div>
  </main>
  <script>
    const title = "[ELECTRONIC]ODONATA";
    const speed = 60000 / (45 * 5); // 45 WPM

    const typed = document.getElementById("typed-text");
    const live = document.querySelector(".type-live");

    let position = 0;

    function typeNext() {
      if (position < title.length) {
        typed.textContent += title[position];
        position++;
        setTimeout(typeNext, speed);
      } else {
        live.classList.add("finished");
      }
    }

    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      typed.textContent = title;
    } else {
      document.fonts.ready.then(typeNext);
    }
  </script>
</body>
</html>
