
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  <title>Dragonfly - Canvas Test</title>

  <link rel="icon" type="image/svg+xml"
        href="../favicon.svg">

  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #ffffff;
      color: #111111;
    }

    main {
      min-height: 100vh;
      min-height: 100svh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .stage {
      width: 100%;
      max-width: 800px;
    }

    canvas, picture, img {
      display: block;
      width: 100%;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #1a1d21;
        color: #eeeeee;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="stage">
      <canvas
        id="ascii-dragonfly"
        role="img"
        aria-label="Animated ASCII dragonfly">
      </canvas>

      <noscript>
        <picture>
          <source
            media="(prefers-color-scheme: dark)"
            srcset="../dragonfly.dark.svg">
          <img src="../dragonfly.svg"
               alt="Dragonfly">
        </picture>
      </noscript>
    </div>
  </main>

  <script type="module" src="./main.ts"></script>
</body>
</html>
